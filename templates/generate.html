<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script>
        function adjustFormFields() {
            const userType = document.getElementById('user_type').value;
            document.getElementById('bicycle_fields').style.display = 'none';
            document.getElementById('motorbike_fields').style.display = 'none';
            document.getElementById('car_fields').style.display = 'none';

            if (userType === 'Bicycle') {
                document.getElementById('bicycle_fields').style.display = 'block';
            } else if (userType === 'Motorbike') {
                document.getElementById('motorbike_fields').style.display = 'block';
            } else if (userType === 'Car') {
                document.getElementById('car_fields').style.display = 'block';
            }
        }
    </script>
</head>
<body>
    <h1>Register</h1>
    <form action="/register" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <label for="user_type">User Type:</label>
        <select id="user_type" name="user_type" onchange="adjustFormFields()" required>
            <option value="Bicycle">Bicycle</option>
            <option value="Motorbike">Motorbike</option>
            <option value="Car">Car</option>
        </select><br>

        <!-- Fields for Bicycle -->
        <div id="bicycle_fields" style="display:none;">
            <label for="bike_color">Bicycle Color:</label>
            <input type="text" id="bike_color" name="bike_color"><br>
            <label for="bike_type">Bicycle Type:</label>
            <input type="text" id="bike_type" name="bike_type"><br>
        </div>

        <!-- Fields for Motorbike -->
        <div id="motorbike_fields" style="display:none;">
            <label for="motorbike_registration">Motorbike Registration:</label>
            <input type="text" id="motorbike_registration" name="motorbike_registration"><br>
            <label for="motorbike_model">Motorbike Model:</label>
            <input type="text" id="motorbike_model" name="motorbike_model"><br>
        </div>

        <!-- Fields for Car -->
        <div id="car_fields" style="display:none;">
            <label for="car_color">Car Color:</label>
            <input type="text" id="car_color" name="car_color"><br>
            <label for="car_model">Car Model:</label>
            <input type="text" id="car_model" name="car_model"><br>
            <label for="car_registration">Car Registration:</label>
            <input type="text" id="car_registration" name="car_registration"><br>
        </div>

        <label for="valid_until">Valid Until:</label>
        <input type="date" id="valid_until" name="valid_until"><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>

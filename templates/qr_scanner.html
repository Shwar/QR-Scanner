<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2rem;
            color: #0056b3;
            margin-bottom: 20px;
        }

        /* Loading Section */
        #loading {
            font-size: 1rem;
            color: #999;
            margin-bottom: 20px;
        }

        /* Video Container */
        #qr-video {
            width: 90%;
            max-width: 400px;
            border: 5px solid #0056b3;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* QR Result Display */
        #qr-result {
            font-size: 1.2rem;
            color: #28a745;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }

        /* Buttons */
        button {
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #0056b3;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            display: inline-block;
        }

        button:hover {
            background-color: #004494;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #send-to-server, #restart-scan {
            display: none; /* Initially hidden */
        }

        /* Canvas (Hidden) */
        #qr-canvas {
            display: none;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
        }

        footer a {
            color: #0056b3;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>QR Code Scanner</h1>
    <div id="loading">Initializing camera...</div>
    <video id="qr-video" autoplay muted></video>
    <canvas id="qr-canvas"></canvas>
    <div id="qr-result"></div>
    <button id="send-to-server">Send to Server</button>
    <button id="restart-scan">Restart Scan</button>

    <footer>
        &copy; 2025 | Made with ❤️ | <a href="https://example.com" target="_blank">TUMPass Pass</a>
    </footer>

    <script>
        const video = document.getElementById("qr-video");
        const canvasElement = document.getElementById("qr-canvas");
        const canvas = canvasElement.getContext("2d");
        const qrResult = document.getElementById("qr-result");
        const sendToServerButton = document.getElementById("send-to-server");
        const restartButton = document.getElementById("restart-scan");

        let videoStream = null;
        let isScanning = true; // Control scanning loop
        let extractedQRData = null;

        // Initialize the camera and start scanning
        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = videoStream;
                video.play();
                requestAnimationFrame(scanQRCode);
                document.getElementById("loading").textContent = "Camera ready. Point at a QR Code.";
            } catch (err) {
                console.error("Camera access error:", err);
                document.getElementById("loading").textContent = "Failed to access camera!";
            }
        }

        // Stop the video stream and scanning loop
        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            isScanning = false; // Stop scanning
        }

        function scanQRCode() {
            if (!isScanning) return; // Exit if scanning is stopped

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, canvasElement.width, canvasElement.height);

                if (code) {
                    // QR Code detected
                    extractedQRData = code.data;
                    qrResult.textContent = `QR Data: ${code.data}`;
                    sendToServerButton.style.display = "inline-block";
                    restartButton.style.display = "inline-block";

                    stopCamera(); // Stop camera once QR code is detected
                    return;
                }
            }
            requestAnimationFrame(scanQRCode);
        }

        // Send QR data to the server
        sendToServerButton.addEventListener("click", () => {
            if (!extractedQRData) {
                alert("No QR Data to send!");
                return;
            }

            fetch('http://127.0.0.1:5000/scan_qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qrData: extractedQRData })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    alert("QR Data logged successfully!");
                    console.log("Server response:", data);
                } else {
                    alert(`Error: ${data.error}`);
                    console.error("Server error:", data);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred while sending the QR data to the server.");
            });
        });

        // Restart scan by reloading the page
        restartButton.addEventListener("click", () => {
            stopCamera(); // Ensure camera is stopped
            location.reload();
        });

        // Start the camera on page load
        startCamera();
    </script>
</body>
</html>
